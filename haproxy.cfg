global
    log stdout format raw local0
    maxconn 10000

defaults
    log     global
    mode    tcp
    option  tcplog
    option  clitcpka
    option  srvtcpka
    timeout connect 5s
    timeout client  2h
    timeout server  2h
    timeout check   5s

frontend tcp_in_443
    bind *:443
    maxconn 8000
    option tcp-smart-accept
    use_backend web if { req_ssl_sni -i nextcloud.reisber.space }   
    default_backend telemt_nodes
    
backend telemt_nodes
    option tcp-smart-connect
    server server_a 192.168.100.37:8443 check inter 5s rise 2 fall 3 send-proxy-v2


frontend https_front
    bind 0.0.0.0:7443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }

    # Разделение по доменам (SNI)
    use_backend mtprotoyan if { req_ssl_sni -i yandex.ru }
    use_backend  web if { req_ssl_sni -i matrix.nsplz.ru }
    use_backend nginx if { req_ssl_sni -i cdn.lord-mikrotik.ru }
    use_backend nginx if { req_ssl_sni -i math.admin1350.ru }
    use_backend nginx if { req_ssl_sni -i q5xcmadmfo.cdn.twcstorage.ru }
    default_backend mtprotoyan

backend nginx
    mode tcp
    server nginxcloud 127.0.0.1:81

backend web
    mode tcp
    server yandex 192.168.100.37:443
#    http-request add-header X-Forwarded-For %[src]
#send-proxy-v2


backend mtprotoyan
    mode tcp
#  option forwardfor
    server mtporto 172.23.188.14:8443
